services:
  - type: web
    name: ritesh-singh-portfolio
    runtime: node
    plan: free
    buildCommand: python3 -m zipfile -e portfolio-source.zip . && cd portfolio && corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: cd portfolio && npx next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /about
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NEXT_TELEMETRY_DISABLED
        value: 1
